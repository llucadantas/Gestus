server:
  port: 8080

spring:
  application:
    name: Gestus
  docker:
    compose:
      file: ./compose.yaml
  config:
    import: "optional:file:.env[.properties]"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  jwt:
    expiration: ${JWT_EXPIRATION:900000}
    key: ${JWT_KEY}



